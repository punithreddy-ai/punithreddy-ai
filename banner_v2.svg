<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="45%" stop-color="#122A43"/>
      <stop offset="75%" stop-color="#1C4A63"/>
      <stop offset="100%" stop-color="#2C7A7B"/>
    </linearGradient>
    <radialGradient id="spot1" cx="18%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#F6AD55" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F6AD55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B4E4DD"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#spot1)"/>
  <rect width="1200" height="260" fill="url(#spot2)"/>

  <!-- faint grid, tech texture -->
  <g stroke="#7FDBDA" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="260"/>
    <line x1="300" y1="0" x2="300" y2="260"/>
    <line x1="500" y1="0" x2="500" y2="260"/>
    <line x1="700" y1="0" x2="700" y2="260"/>
    <line x1="900" y1="0" x2="900" y2="260"/>
    <line x1="1100" y1="0" x2="1100" y2="260"/>
  </g>

  <!-- floating code snippet, left -->
  <g font-family="Fira Code, Consolas, monospace" font-size="15" fill="#7FDBDA" opacity="0.55">
    <text x="50" y="60">class Engineer:</text>
    <text x="72" y="82">def __init__(self):</text>
    <text x="94" y="104">self.curious = True</text>
    <text x="72" y="126">def build(self, idea):</text>
    <text x="94" y="148">return shipped_project</text>
  </g>

  <!-- constellation / network motif, right -->
  <g opacity="0.7">
    <circle cx="960" cy="55" r="4" fill="#F6AD55"/>
    <circle cx="1030" cy="40" r="3" fill="#7FDBDA"/>
    <circle cx="1080" cy="80" r="4" fill="#F6AD55"/>
    <circle cx="1020" cy="105" r="3" fill="#7FDBDA"/>
    <circle cx="1120" cy="55" r="3" fill="#7FDBDA"/>
    <circle cx="1000" cy="150" r="4" fill="#F6AD55"/>
    <circle cx="1070" cy="175" r="3" fill="#7FDBDA"/>
    <circle cx="1140" cy="140" r="4" fill="#F6AD55"/>
    <circle cx="1110" cy="200" r="3" fill="#7FDBDA"/>
    <circle cx="1040" cy="215" r="3" fill="#7FDBDA"/>
    <g stroke="#9FE8E3" stroke-width="1" opacity="0.55">
      <line x1="960" y1="55" x2="1030" y2="40"/>
      <line x1="1030" y1="40" x2="1080" y2="80"/>
      <line x1="1080" y1="80" x2="1020" y2="105"/>
      <line x1="1080" y1="80" x2="1120" y2="55"/>
      <line x1="1020" y1="105" x2="1000" y2="150"/>
      <line x1="1000" y1="150" x2="1070" y2="175"/>
      <line x1="1070" y1="175" x2="1140" y2="140"/>
      <line x1="1070" y1="175" x2="1110" y2="200"/>
      <line x1="1110" y1="200" x2="1040" y2="215"/>
    </g>
  </g>

  <!-- title block, centered -->
  <text x="600" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="url(#textGrad)" filter="url(#softGlow)">
    Punithreddy K R
  </text>
  <text x="600" y="152" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#BFEAE6" letter-spacing="2">
    AI / ML ENGINEER IN THE MAKING
  </text>

  <!-- accent divider with dot -->
  <line x1="480" y1="172" x2="720" y2="172" stroke="#4FD1C5" stroke-width="1.5" opacity="0.8"/>
  <circle cx="600" cy="172" r="4" fill="#F6AD55"/>

  <text x="600" y="205" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#8FB8C4" letter-spacing="1">
    Python &#8226; Machine Learning &#8226; Full-Stack &#8226; Always Shipping
  </text>
</svg>
